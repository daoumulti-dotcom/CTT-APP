services:
  ctt:
    build: .
    image: ctt-platform:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: "5000"
      DATABASE_URL: "file:/app/data/ctt.db"
      TRUST_PROXY_HOPS: "1"
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  backup:
    image: ctt-platform:production
    restart: unless-stopped
    depends_on:
      ctt:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "file:/app/data/ctt.db"
      CTT_BACKUP_DIR: "/backups"
    volumes:
      - ./data:/app/data:ro
      - ./backups:/backups
    command: ["sh", "-c", "while :; do node scripts/backup-ctt.mjs || echo 'Sauvegarde CTT échouée'; sleep 86400; done"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      ctt:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config:
